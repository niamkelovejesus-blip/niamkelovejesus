<style>
:root{--side:#0b0d12;--side2:#1a1d26;--navy:#1e3a8a;--blue:#3b82f6;--gold:#b8893f;--bg:#f6f7f9;--line:#e4e7ec;--mut:#667085;--ok:#18794e;--bad:#b42318;--warn:#a15c07;--ink:#101828}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0;font-weight:700}
.hide{display:none!important}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:inherit;font-weight:500;display:inline-flex;align-items:center;gap:6px}
button:hover{background:#f0f2f5}
button:disabled{opacity:.55;cursor:wait}
button.p{background:var(--ink);border-color:var(--ink);color:#fff}
button.p:hover{background:#2a303c}
button.d{color:var(--bad)}
button.ok{color:var(--ok)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--side)}
#login form{background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;display:grid;gap:14px}
#login #rf{background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;display:grid;gap:14px}
.lk{border:0;background:none;color:var(--navy);padding:0;justify-content:center;text-decoration:underline}
.lk:hover{background:none}
#login h1{font-size:22px}
#login p{margin:0;color:var(--mut)}
label{display:grid;gap:4px;font-weight:600}
.pw{position:relative;display:block}.pw input{padding-right:92px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 10px;border:0;background:transparent;color:var(--navy);font-weight:600}
.err{color:var(--bad);min-height:20px;font-weight:500}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid #20242e;margin-bottom:8px}
.brand b{font-size:17px;display:block}
.brand small{color:#c9a96a;font-size:12px}
.grp{margin:14px 10px 4px;color:#7b8394;font-size:12px;font-weight:600}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cdd3df;cursor:pointer}
#nav a:hover{background:var(--side2)}
#nav a.on{background:var(--side2);color:#fff;font-weight:600}
#me{margin-top:auto;padding:12px 10px 8px;color:#9aa3b5;font-size:12px;word-break:break-all;border-top:1px solid #20242e}
aside button{background:transparent;color:#fff;border-color:#2c3240;justify-content:center}
aside button:hover{background:var(--side2)}
#meav{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 8px;border-top:1px solid #20242e;cursor:pointer;color:#9aa3b5;font-size:12px}
#meav:hover{color:#fff}
#me{margin-top:0;border-top:0;padding-top:0}
.meimg{width:46px;height:46px;border-radius:50%;background:#2c3240 center/cover no-repeat;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);color:var(--mut)}
.top b{color:var(--ink)}
.chip{border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--bg);font-size:13px}
main{padding:24px 28px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:22px}
.head p{margin:2px 0 0;color:var(--mut)}
.head input{max-width:320px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.card b{font-size:26px;letter-spacing:-.5px}
.m{color:var(--mut)}
.panels{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.donut span{background:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;text-align:center;line-height:1.1}
.leg{display:grid;gap:6px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg em{margin-left:auto;font-style:normal;font-weight:600}
.formc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.formc h3{font-size:15px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.fg .w{grid-column:1/-1}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f9fafb;font-weight:600;color:var(--mut);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.a{white-space:nowrap;text-align:right}
td select{width:auto;min-width:118px;padding-right:28px}
td.a button+button{margin-left:6px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.badge{margin-left:auto;background:#f59e0b;color:#111;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.avl{cursor:pointer;display:block;position:relative}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:#eef1f5;font-size:12px;font-weight:600}
.tag.validated,.tag.approved{background:#e3f4ea;color:var(--ok)}
.tag.pending{background:#fdf0d8;color:var(--warn)}
.tag.failed,.tag.rejected{background:#fbe4e1;color:var(--bad)}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9}
#toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;max-width:320px}
#toast div.e{background:var(--bad)}
#vm{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:20;padding:16px}
#vm video{max-width:100%;max-height:86vh;border-radius:12px;background:#000}
.vd{display:block;color:var(--mut);font-size:12px;margin-top:2px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
 .brand{width:100%}
 #nav{display:flex;flex-wrap:wrap;gap:4px}
 .grp,#me{display:none}
 .panels{grid-template-columns:1fr}
 main{padding:14px}.top{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login" class="hide">
  <form id="lf">
    <h1>Niamké Love Jésus</h1>
    <p>Espace d'administration</p>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Mot de passe<span class="pw"><input type="password" name="pw" required autocomplete="current-password"><button type="button" id="eye" aria-label="Afficher le mot de passe">Afficher</button></span></label>
    <button class="p" type="submit" style="justify-content:center">Se connecter</button>

</div>

<script>
const SB_URL = 'https://qxxhbfoqlreiqyshbpqp.supabase.co';
const SB_KEY = 'sb_publishable_OK9ncVWB2Ih8xZ5fzqEQWg_mSV6vCoe'; // clé publique : la sécurité est assurée par les règles RLS
let store; try { window.sessionStorage.setItem('_t', '1'); window.sessionStorage.removeItem('_t'); store = window.sessionStorage; } catch (e) {}
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, storage: store, autoRefreshToken: true } });

// Client anonyme (sans connexion) : sert à vérifier que le public voit bien ce que l'admin publie

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = d => d ? new Date(d).toLocaleDateString('fr-FR') : '';
const money = (n, c) => new Intl.NumberFormat('fr-FR').format(Number(n) || 0) + ' ' + (c || 'FCFA');

const IC = {

};

};

const PAGE = 300;

}
async function q(p) { const r = await p; if (r.error) throw r.error; return r; }
// Suppression vérifiée : la base peut refuser SANS erreur (règles RLS) et renvoyer 0 ligne. On le détecte.
const REFUSED = 'Refusé par la base de données (aucune ligne modifiée). Exécutez le script « supabase_setup.sql » dans Supabase pour autoriser les administrateurs.';
async function delRows(builder) { const r = await q(builder.select('id')); if (!r.data || !r.data.length) throw new Error(REFUSED); return r; }
async function updRows(builder) { const r = await q(builder.select('id')); if (!r.data || !r.data.length) throw new Error(REFUSED); return r; }

const ym = d => { d = d && !isNaN(d) ? d : new Date(); return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
const extOf = n => { const m = /\.([A-Za-z0-9]{2,5})$/.exec(n || ''); return m ? m[1].toLowerCase() : 'mp3'; };
const cleanTitle = n => String(n || '').replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
const audioPath = (title, ext, d) => `audio/${ym(d)}/${slug(title)}-${uid8()}.${ext}`;
const fmtSize = b => b ? (b >= 1e6 ? (b / 1e6).toFixed(1) + ' Mo' : Math.max(1, Math.round(b / 1e3)) + ' Ko') : '';
function audioDuration(file) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(file), done = v => { URL.revokeObjectURL(u); res(v); };
    a.preload = 'metadata'; a.onloadedmetadata = () => done(isFinite(a.duration) ? Math.round(a.duration) : null); a.onerror = () => done(null);
    setTimeout(() => done(null), 6000); a.src = u;
  });
}
async function act(fn, msg) {
  if (act.busy) { toast('Action en cours, patientez un instant…', true); return false; }   // évite les doubles clics (ex. valider deux fois un paiement)
  act.busy = true;
  try { await fn(); toast(msg); go(cur); return true; } catch (e) { act.err = e.message || 'Erreur'; toast(act.err, true); return false; }
  finally { act.busy = false; }
}
const head = (t, sub = '', extra = '') => `<div class="head"><div><h2>${t}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${extra}</div>`;
function tbl(cols, rows) {
  if (!rows.length) return '<p class="m">Aucune donnée pour le moment.</p>';
  return `<div class="wrap"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td${c[2] ? ' class="a"' : ''}>${c[1](r)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}
function sel(base, val, c, id) {
  const opts = [...new Set([...base, val].filter(Boolean))];
  return `<select data-c="${c}" data-id="${esc(id)}">${opts.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
const fld = ([k, l, t, o]) => {
  const w = t === 'textarea' ? ' class="w"' : '';
  const inp = t === 'textarea' ? `<textarea name="${k}"></textarea>` : t === 'select' ? `<select name="${k}">${o.map(x => `<option>${x}</option>`).join('')}</select>` : `<input name="${k}">`;
  return `<label${w}>${l}${inp}</label>`;
};

async function upImg(file, dir) {
  if (!file || !file.size) return null;
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw new Error('Image refusée : formats acceptés JPG, PNG, WEBP ou GIF.');
  if (file.size > 5 * 1024 * 1024) throw new Error('Image trop lourde (5 Mo maximum).');
  const path = `${dir || 'content'}/${ym()}/${uid8()}-${file.name.replace(/[^\w.\-]+/g, '_')}`;
  await q(sb.storage.from('images').upload(path, file, { contentType: file.type, cacheControl: '31536000' }));
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
}

  const vals = days.map(d => by[d]), mx = Math.max(...vals, 1);

  const line = pts.map(p => p.join(',')).join(' ');

  let acc = 0; const stops = main5.map(([, n], i) => { const a = acc / tot * 100; acc += n; return `${col[i]} ${a}% ${acc / tot * 100}%`; }).join(',');

const MAX_VIDEO = 50 * 1024 * 1024;   // 50 Mo = limite par défaut de Supabase (offre gratuite). Augmentez-la ici ET dans Supabase si votre offre le permet.
const fmtDT = d => d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
function vidStatus(r) {
  const now = Date.now(), pa = r.publish_at && new Date(r.publish_at), ex = r.expires_at && new Date(r.expires_at);
  if (pa && pa > now) return `<span class="tag pending">Programmée</span><span class="vd">le ${esc(fmtDT(pa))}</span>`;
  if (ex && ex < now) return `<span class="tag rejected">Expirée</span><span class="vd">depuis le ${esc(day(ex))}</span>`;
  return '<span class="tag approved">En ligne</span>' + (ex ? `<span class="vd">jusqu’au ${esc(fmtDT(ex))}</span>` : '<span class="vd">sans limite</span>');
}
const fmtDur = s => s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
const vidUrl = v => v.url || (v.storage_path ? sb.storage.from('videos').getPublicUrl(v.storage_path).data.publicUrl : '');

        <button class="p" type="submit">${ico('plus')}Envoyer la vidéo</button><div class="err" data-e role="alert"></div></form>`

      ['Type', r => r.kind === 'priere' ? '<span class="tag">Prière</span>' : '<span class="tag">Souvenir</span>'],

async function squeeze(file, kbps) {
  if (!window.lamejs) throw new Error('Outil de compression indisponible : vérifiez votre connexion ou choisissez « Original ».');
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let buf; try { buf = await ctx.decodeAudioData(await file.arrayBuffer()); } finally { ctx.close(); }
  const ch = Math.min(buf.numberOfChannels, 2), enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, kbps);
  const to16 = f => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); o[i] = v < 0 ? v * 32768 : v * 32767; } return o; };
  const L = to16(buf.getChannelData(0)), R = ch > 1 ? to16(buf.getChannelData(1)) : null, step = 1152 * 10, parts = [];
  for (let i = 0, n = 0; i < L.length; i += step, n++) {
    const o = ch > 1 ? enc.encodeBuffer(L.subarray(i, i + step), R.subarray(i, i + step)) : enc.encodeBuffer(L.subarray(i, i + step));
    if (o.length) parts.push(o);
    if (n % 30 === 0) await new Promise(r => setTimeout(r));
  }
  const end = enc.flush(); if (end.length) parts.push(end);
  return new File(parts, file.name.replace(/\.[^.]+$/, '') + '.mp3', { type: 'audio/mpeg' });
}

// ---- Traduction automatique des paroles (même service que le site) ----
const AUTO_LANGS = ['fr', 'en', 'es', 'pt', 'it', 'de', 'ar', 'zh-CN', 'nl', 'ru'];
const TS_RE = /^(\[\d+:\d+(?:\.\d+)?\]\s*)?(.*)$/;
async function gtxLines(lines, tl) {
  const SEP = '\n§§§\n';
  const r = await fetch('https://translate.googleapis.com/translate_a/single', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'client=gtx&sl=auto&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(lines.join(SEP))
  });
  if (!r.ok) throw new Error('Service de traduction indisponible');
  const j = await r.json(), full = (j[0] || []).map(x => x[0] || '').join('');
  const parts = full.split(/\s*§\s*§\s*§\s*/);
  if (parts.length !== lines.length) throw new Error('Découpage incohérent');
  return parts.map(x => x.trim());
}
async function autoTranslate(mid, langue, texte) {
  const lines = texte.split(/\r?\n/), idx = lines.map((l, i) => l.trim() ? i : -1).filter(i => i >= 0);
  const parsed = idx.map(i => TS_RE.exec(lines[i].trim()));
  const have = new Set(Object.values(cache.lyr || {}).filter(x => String(x.musique_id) === String(mid)).map(x => x.langue));
  const ok = [], ko = [];
  for (const tl of AUTO_LANGS) {
    const code = tl.slice(0, 2);
    if (code === langue || have.has(code)) continue;
    try {
      const out = [];
      for (let k = 0; k < parsed.length; k += 30) out.push(...await gtxLines(parsed.slice(k, k + 30).map(m => m[2]), tl));
      const res = lines.slice(); idx.forEach((i, k) => { res[i] = (parsed[k][1] || '') + out[k]; });
      await q(sb.from('paroles').upsert({ musique_id: mid, langue: code, texte: res.join('\n') }, { onConflict: 'musique_id,langue' }));
      ok.push(code);
    } catch (e) { ko.push(code); }
  }
  if (ok.length) toast('Traductions ajoutées : ' + ok.join(', ').toUpperCase());
  if (ko.length) toast('Traduction impossible pour : ' + ko.join(', ').toUpperCase() + ' (réessayez plus tard)', true);
}

// ---- Envoi d'une vidéo : lecture des infos, miniature automatique, envoi avec progression ----
function videoInfo(file) {
  return new Promise(res => {
    const v = document.createElement('video'), u = URL.createObjectURL(file); let done = false, dur = null;
    const end = r => { if (done) return; done = true; URL.revokeObjectURL(u); res(r); };
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    v.onloadedmetadata = () => { dur = isFinite(v.duration) ? Math.round(v.duration) : null; v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = () => {
      try {
        const w = v.videoWidth, h = v.videoHeight, k = Math.min(1, 640 / (w || 640)), c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(b => end({ duration: dur, poster: b }), 'image/jpeg', .8);
      } catch (e) { end({ duration: dur, poster: null }); }
    };
    v.onerror = () => end({ duration: null, poster: null });
    setTimeout(() => end({ duration: dur, poster: null }), 8000);
    v.src = u;
  });
}
async function upVideo(file, path, onPct) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Session expirée : reconnectez-vous.');
  await new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${SB_URL}/storage/v1/object/videos/${path.split('/').map(encodeURIComponent).join('/')}`);
    x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('Content-Type', 'video/mp4');
    x.setRequestHeader('Cache-Control', 'max-age=31536000');
    x.upload.onprogress = e => { if (e.lengthComputable) onPct(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status < 300) return ok();
      let m = ''; try { m = JSON.parse(x.responseText).message; } catch (e) {}
      ko(new Error(m || 'erreur ' + x.status));
    };
    x.onerror = () => ko(new Error('connexion perdue pendant l’envoi.'));
    x.send(file);
  });
}

    if (!rows || !rows.length) return toast('Rien à exporter', true);
    const ks = Object.keys(rows[0]), cell = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const t = [ks.join(';'), ...rows.map(r => ks.map(k => cell(r[k])).join(';'))].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/csv' }));
    a.download = b.dataset.k + '.csv'; a.click();
  },
  repSuspend: id => { const t = cache.repTarget[id]; if (!t) return toast('Profil introuvable', true); return confirm('Suspendre ' + (t.name || t.email || 'ce membre') + ' ? Son profil ne sera plus visible sur le site.') && act(() => updRows(sb.from('profiles').update({ status: 'rejected' }).eq('id', t.id)), 'Profil suspendu'); },
  repRestore: id => { const t = cache.repTarget[id]; if (!t) return toast('Profil introuvable', true); return act(() => updRows(sb.from('profiles').update({ status: 'approved' }).eq('id', t.id)), 'Profil réactivé'); },
  repClose: id => confirm('Classer ce signalement ? Il sera supprimé de la liste.') && act(() => delRows(sb.from('reports').delete().eq('id', id)), 'Signalement classé'),
  delMsg: id => {
    const m = cache.msg[id]; if (!m) return;
    return confirm('Supprimer définitivement ce message ?') && act(async () => {
      await delRows(sb.from('messages').delete().eq('id', id));
      if (String(m.body || '').startsWith('voice:')) { try { await sb.storage.from('voice').remove([m.body.slice(6)]); } catch (e) {} }
    }, 'Message supprimé');
  },
  delConf: id => confirm('Supprimer cette confession ?') && act(() => delRows(sb.from('confessions').delete().eq('id', id)), 'Confession supprimée'),
  delProfile: id => {
    const m = (cache.members || []).find(x => String(x.id) === String(id));
    const n = m ? ([m.name, m.last_name].filter(Boolean).join(' ') || m.email || 'ce membre') : 'ce membre';
    if (!confirm(`Supprimer définitivement ${n} ?\n\nSon profil ET son compte de connexion seront effacés (il ne pourra plus se reconnecter). Action irréversible.`)) return;
    return act(async () => {
      const r = await sb.rpc('admin_delete_member', { p_id: String(id) });
      if (!r.error) return;
      const msg = r.error.message || '';
      if (/admin_delete_member/.test(msg) && /(schema cache|does not exist|Could not find)/i.test(msg)) {
        // Script SQL pas encore exécuté : suppression directe du profil seulement (vérifiée)
        await delRows(sb.from('profiles').delete().eq('id', id));
        toast('Profil supprimé, mais son compte de connexion existe encore et le profil se recréera à sa prochaine connexion. Exécutez supabase_setup.sql.', true);
        return;
      }
      throw r.error;
    }, 'Membre supprimé');
  },
  payNo: id => confirm('Refuser ce paiement ?') && act(() => q(sb.rpc('admin_reject_payment', { p_payment_id: id })), 'Paiement refusé'),
  payOk: id => {
    const p = cache.pay[id];
    const MONTHS = { 'Mensuel': 1, 'Alliance': 6, 'Éternelle': 12 };
    const months = MONTHS[p.plan];
    if (!months) return toast(`Offre « ${p.plan || '?'} » inconnue : activation impossible.`, true);
    if (!confirm(`Valider ${money(p.amount, p.currency)} de ${p.email || 'ce membre'} et activer « ${p.plan} » pour ${months} mois ?`)) return;
    act(() => q(sb.rpc('admin_activate_premium', { p_payment_id: id, p_months: months })), 'Paiement validé · Premium activé');
  },
  togglePrayer: (id, b) => act(() => updRows(sb.from('prayers').update({ visible: b.dataset.v === '1' }).eq('id', id)), 'Prière mise à jour'),
  delPrayer: id => confirm('Supprimer cette prière ?') && act(() => delRows(sb.from('prayers').delete().eq('id', id)), 'Prière supprimée'),
  playSong: async id => {
    try {
      const v = cache.songs[id][cache.pk];
      let url = v;
      if (!/^https?:/i.test(v)) url = (await q(sb.storage.from('musiques').createSignedUrl(v, 600))).data.signedUrl;
      new Audio(url).play();
    } catch (e) { toast(e.message || 'Lecture impossible', true); }
  },
  delSong: id => confirm('Supprimer cette musique (fichier et paroles) ?') && act(async () => {
    const v = cache.pk && cache.songs[id][cache.pk];
    await delRows(sb.from('musiques').delete().eq('id', id));          // d'abord la ligne (vérifiée)…
    if (v && !/^https?:/i.test(v)) await sb.storage.from('musiques').remove([v]);   // …puis le fichier
  }, 'Musique supprimée'),
  editSong: id => {
    const s = cache.songs[id]; if (!s) return;
    const tk = ['title', 'titre', 'nom', 'name'].find(k => k in s) || 'title', ak = ['artist', 'artiste'].find(k => k in s);
    const t = prompt('Titre de la musique :', songName(s)); if (t === null) return;
    const patch = { [tk]: t.trim() || songName(s) };
    if (ak) { const a = prompt('Artiste / auteur-compositeur :', s[ak] || ''); if (a === null) return; patch[ak] = a.trim() || null; }
    return act(() => updRows(sb.from('musiques').update(patch).eq('id', id)), 'Musique mise à jour');
  },
  reorg: async () => {
    const todo = Object.values(cache.songs).filter(s => { const v = cache.pk && s[cache.pk]; return v && !/^https?:/i.test(v) && !String(v).startsWith('audio/'); });
    if (!todo.length) return toast('Tous les fichiers sont déjà rangés.');
    if (!confirm(`Ranger ${todo.length} fichier(s) dans audio/année/mois/ avec un nom propre ?\nLe site continuera de les lire normalement.`)) return;
    let ok = 0; const ko = [];
    for (const s of todo) {
      const old = s[cache.pk], dest = audioPath(cleanTitle(songName(s)), extOf(old), new Date(s.created_at));
      try {
        await q(sb.storage.from('musiques').move(old, dest));
        const patch = {}; Object.keys(s).forEach(k => { if (PATH_KEY.test(k) && s[k] === old) patch[k] = dest; });
        const r = await q(sb.from('musiques').update(patch).eq('id', s.id).select('id'));
        if (!r.data.length) { await sb.storage.from('musiques').move(dest, old); throw new Error('mise à jour refusée'); }
        ok++;
      } catch (e) { ko.push(songName(s) + ' : ' + (e.message || e)); }
    }
    if (ok) toast(`${ok} fichier(s) rangé(s)`);
    if (ko.length) toast('Non rangé : ' + ko.join(' | '), true);
    go('songs');
  },
  playVideo: id => {
    const v = cache.vids[id], u = v && vidUrl(v); if (!u) return toast('Vidéo introuvable', true);
    const o = document.createElement('div'); o.id = 'vm'; o.innerHTML = `<video controls autoplay playsinline src="${esc(u)}"></video>`;
    const close = () => { o.remove(); document.removeEventListener('keydown', key); }, key = e => { if (e.key === 'Escape') close(); };
    o.onclick = e => { if (e.target === o) close(); }; document.addEventListener('keydown', key); document.body.append(o);
  },
  republish: id => {
    const v = cache.vids[id]; if (!v) return;
    const n = prompt('Republier maintenant pour combien de jours ?\n(7 = une semaine, 0 = sans limite)', v.kind === 'priere' ? '7' : '0'); if (n === null) return;
    const d = Number(String(n).replace(',', '.')); if (!isFinite(d) || d < 0) return toast('Nombre de jours invalide', true);
    const now = new Date();
    return act(() => updRows(sb.from('videos_souvenirs').update({ publish_at: now.toISOString(), expires_at: d ? new Date(now.getTime() + d * 864e5).toISOString() : null }).eq('id', id)), 'Vidéo republiée');
  },
  editVideo: id => {
    const v = cache.vids[id]; if (!v) return;
    const t = prompt('Titre de la vidéo :', v.title || ''); if (t === null) return;
    const patch = { title: t.trim() || v.title };
    if ('description' in v) { const d = prompt('Description :', v.description || ''); if (d === null) return; patch.description = d.trim() || null; }
    return act(() => updRows(sb.from('videos_souvenirs').update(patch).eq('id', id)), 'Vidéo mise à jour');
  },
  delVideo: id => confirm('Supprimer cette vidéo (le fichier sera effacé définitivement) ?') && act(async () => {
    const v = cache.vids[id];
    await delRows(sb.from('videos_souvenirs').delete().eq('id', id));                       // d'abord la ligne (vérifiée)…
    if (v && v.storage_path) await sb.storage.from('videos').remove([v.storage_path]);      // …puis le fichier
  }, 'Vidéo supprimée'),
  delRow: (id, b) => { const g = G[b.dataset.k]; return confirm(`Supprimer ${g.f ? 'cette' : 'ce'} ${g.one} ?`) && act(() => delRows(sb.from(g.table).delete().eq('id', id)), `${g.one[0].toUpperCase() + g.one.slice(1)} supprimé${g.f ? 'e' : ''}`); }
};
const C = {
  plan: (id, v) => act(() => q(sb.rpc('admin_set_plan', { p_profile_id: id, p_plan: v })), 'Offre mise à jour'),
  pstatus: (id, v) => act(() => updRows(sb.from('profiles').update({ status: v }).eq('id', id)), 'Statut mis à jour')
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (b) return A[b.dataset.a] && A[b.dataset.a](b.dataset.id, b);
  const t = e.target.closest('[data-t]'); if (t) { e.preventDefault(); go(t.dataset.t); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.c) C[t.dataset.c](t.dataset.id, t.value);
  if (t.dataset && t.dataset.p && t.files[0]) act(async () => {
    const u = await upImg(t.files[0], 'members');
    await updRows(sb.from('profiles').update({ photo_url: u }).eq('id', t.dataset.p));
  }, 'Photo mise à jour');
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.f) return;
  e.preventDefault(); const b = f.querySelector('button.p'), t0 = b.innerHTML, box = f.querySelector('[data-e]');
  b.disabled = true; if (box) box.textContent = '';
  const ok = await act(() => FORMS[f.dataset.f](f), 'Enregistré');
  if (!ok) { b.disabled = false; b.innerHTML = t0; if (box) box.textContent = act.err; }
});

function go(t) {
  cur = t;
  let h = '', g = '';
  Object.entries(TABS).forEach(([k, [n, i, grp]]) => {
    if (grp !== g) { g = grp; h += `<div class="grp">${grp}</div>`; }
    h += `<a href="#${k}" role="button" class="${k === t ? 'on' : ''}" data-t="${k}"${k === t ? ' aria-current="page"' : ''}>${ico(i)}${n}</a>`;
  });
  $('#nav').innerHTML = h; $('#crumb').textContent = TABS[t][0];
  sb.from('payments').select('*', { count: 'exact', head: true }).eq('status', 'pending').then(r => {
    const a = document.querySelector('#nav [data-t="payments"]');
    if (a && r.count) a.insertAdjacentHTML('beforeend', `<span class="badge">${r.count}</span>`);
  });
  sb.from('reports').select('*', { count: 'exact', head: true }).then(r => {
    const a = document.querySelector('#nav [data-t="reports"]');
    if (a && r.count) a.insertAdjacentHTML('beforeend', `<span class="badge">${r.count}</span>`);
  });
  $('#main').innerHTML = '<p class="m">Chargement…</p>';
  const tok = go.tok = (go.tok || 0) + 1;   // ignore une réponse tardive d'un onglet déjà quitté
  V[t]().catch(e => tok === go.tok && ($('#main').innerHTML = `<p class="err">Erreur : ${esc(e.message)}<br><span class="m">Si le message parle de permission, vérifie que ton compte est bien dans la table admins. Si la table n'existe pas, crée-la dans Supabase.</span></p>`));
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (recovering) return showRec();
  if (!session) { $('#app').classList.add('hide'); return $('#login').classList.remove('hide'); }
  const { data, error } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (error || !data) {
    await sb.auth.signOut();
    $('#lerr').textContent = error ? 'Erreur : ' + error.message : "Ce compte n'est pas administrateur.";
    $('#app').classList.add('hide'); return $('#login').classList.remove('hide');
  }
  me = session.user; $('#me').textContent = me.email; paintMe();
  $('#today').textContent = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); go('dashboard');
}
$('#lf').onsubmit = async ev => {
  ev.preventDefault(); $('#lerr').textContent = '';
  const f = new FormData(ev.target);
  const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pw') });
  if (error) return $('#lerr').textContent = 'Connexion refusée : ' + error.message;
  $('#lerr').textContent = ''; $('#lerr').style.color = ''; boot();
};
$('#forgot').onclick = async () => {
  const email = $('#lf').email.value.trim(), m = $('#lerr');
  m.style.color = '';
  if (!email) return m.textContent = "Entrez d'abord votre email ci-dessus.";
  const opt = /^https?:$/.test(location.protocol) ? { redirectTo: location.href.split('#')[0] } : {};
  const { error } = await sb.auth.resetPasswordForEmail(email, opt);
  if (error) return m.textContent = 'Erreur : ' + error.message;
  m.style.color = 'var(--ok)'; m.textContent = 'Si ce compte existe, un email de réinitialisation vient d\'être envoyé.';
};
let recovering = /type=recovery/.test(location.hash);
function showRec() {
  recovering = true; $('#app').classList.add('hide'); $('#login').classList.remove('hide');
  $('#lf').classList.add('hide'); $('#rf').classList.remove('hide');
}
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') showRec(); });
$('#rf').onsubmit = async ev => {
  ev.preventDefault(); const m = $('#rerr'); m.textContent = '';
  const { error } = await sb.auth.updateUser({ password: ev.target.np.value });
  if (error) return m.textContent = 'Erreur : ' + error.message;
  recovering = false; await sb.auth.signOut(); history.replaceState(null, '', location.pathname);
  $('#rf').classList.add('hide'); $('#lf').classList.remove('hide');
  $('#lerr').style.color = 'var(--ok)'; $('#lerr').textContent = 'Mot de passe changé. Connectez-vous.';
};
function paintMe() {
  const u = me && me.user_metadata && me.user_metadata.avatar_url, el = $('#mepic');
  el.style.backgroundImage = u ? `url("${String(u).replace(/"/g, '%22')}")` : '';
  el.textContent = u ? '' : ((me && me.email) || '?')[0].toUpperCase();
}
$('#mefile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const u = await upImg(f, 'admins');
    const { data, error } = await sb.auth.updateUser({ data: { avatar_url: u } });
    if (error) throw error;
    me = data.user; paintMe(); toast('Photo de profil mise à jour');
  } catch (err) { toast('Photo refusée : ' + (err.message || err), true); }
  e.target.value = '';
};
$('#eye').onclick = () => {
  const i = $('#lf').pw, show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  $('#eye').textContent = show ? 'Masquer' : 'Afficher';
  $('#eye').setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
};
$('#out').onclick = async () => { await sb.auth.signOut(); me = null; boot(); };
boot().catch(e => { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lerr').textContent = 'Connexion au serveur impossible : ' + (e.message || e); });
</script>
</body>
</html>
