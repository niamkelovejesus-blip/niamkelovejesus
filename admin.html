<title>Niamké Love Jésus · Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
:root{--side:#0b0d12;--side2:#1a1d26;--navy:#1e3a8a;--blue:#3b82f6;--gold:#b8893f;--bg:#f6f7f9;--line:#e4e7ec;--mut:#667085;--ok:#18794e;--bad:#b42318;--warn:#a15c07;--ink:#101828}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0;font-weight:700}
.hide{display:none!important}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:inherit;font-weight:500;display:inline-flex;align-items:center;gap:6px}
button:hover{background:#f0f2f5}
button:disabled{opacity:.55;cursor:wait}
button.p{background:var(--ink);border-color:var(--ink);color:#fff}
button.p:hover{background:#2a303c}
button.d{color:var(--bad)}
button.ok{color:var(--ok)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--side)}
#login form{background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;display:grid;gap:14px}
#login #rf{background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;display:grid;gap:14px}
.lk{border:0;background:none;color:var(--navy);padding:0;justify-content:center;text-decoration:underline}
.lk:hover{background:none}
#login h1{font-size:22px}
#login p{margin:0;color:var(--mut)}
label{display:grid;gap:4px;font-weight:600}
.pw{position:relative;display:block}.pw input{padding-right:92px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 10px;border:0;background:transparent;color:var(--navy);font-weight:600}
.err{color:var(--bad);min-height:20px;font-weight:500}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid #20242e;margin-bottom:8px}
.brand b{font-size:17px;display:block}
.brand small{color:#c9a96a;font-size:12px}
.grp{margin:14px 10px 4px;color:#7b8394;font-size:12px;font-weight:600}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cdd3df;cursor:pointer}
#nav a:hover{background:var(--side2)}
#nav a.on{background:var(--side2);color:#fff;font-weight:600}
#me{margin-top:auto;padding:12px 10px 8px;color:#9aa3b5;font-size:12px;word-break:break-all;border-top:1px solid #20242e}
aside button{background:transparent;color:#fff;border-color:#2c3240;justify-content:center}
aside button:hover{background:var(--side2)}
#meav{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 8px;border-top:1px solid #20242e;cursor:pointer;color:#9aa3b5;font-size:12px}
#meav:hover{color:#fff}
#me{margin-top:0;border-top:0;padding-top:0}
.meimg{width:46px;height:46px;border-radius:50%;background:#2c3240 center/cover no-repeat;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);color:var(--mut)}
.top b{color:var(--ink)}
.chip{border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--bg);font-size:13px}
main{padding:24px 28px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:22px}
.head p{margin:2px 0 0;color:var(--mut)}
.head input{max-width:320px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.card b{font-size:26px;letter-spacing:-.5px}
.m{color:var(--mut)}
.panels{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.donut span{background:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;text-align:center;line-height:1.1}
.leg{display:grid;gap:6px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg em{margin-left:auto;font-style:normal;font-weight:600}
.formc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.formc h3{font-size:15px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.fg .w{grid-column:1/-1}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f9fafb;font-weight:600;color:var(--mut);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.a{white-space:nowrap;text-align:right}
td select{width:auto;min-width:118px;padding-right:28px}
td.a button+button{margin-left:6px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.badge{margin-left:auto;background:#f59e0b;color:#111;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.avl{cursor:pointer;display:block;position:relative}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:#eef1f5;font-size:12px;font-weight:600}
.tag.validated,.tag.approved{background:#e3f4ea;color:var(--ok)}
.tag.pending{background:#fdf0d8;color:var(--warn)}
.tag.failed,.tag.rejected{background:#fbe4e1;color:var(--bad)}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9}

async function q(p) { const r = await p; if (r.error) throw r.error; return r; }
// Suppression vérifiée : la base peut refuser SANS erreur (règles RLS) et renvoyer 0 ligne. On le détecte.
const REFUSED = 'Refusé par la base de données (aucune ligne modifiée). Exécutez le script « supabase_setup.sql » dans Supabase pour autoriser les administrateurs.';
async function delRows(builder) { const r = await q(builder.select('id')); if (!r.data || !r.data.length) throw new Error(REFUSED); return r; }
async function updRows(builder) { const r = await q(builder.select('id')); if (!r.data || !r.data.length) throw new Error(REFUSED); return r; }
// Rangement des fichiers : dossier/AAAA/MM/nom-lisible-identifiant.ext
const slug = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'sans-titre';

function audioDuration(file) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(file), done = v => { URL.revokeObjectURL(u); res(v); };
    a.preload = 'metadata'; a.onloadedmetadata = () => done(isFinite(a.duration) ? Math.round(a.duration) : null); a.onerror = () => done(null);
    setTimeout(() => done(null), 6000); a.src = u;
  });
}

async function upImg(file, dir) {
  if (!file || !file.size) return null;
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw new Error('Image refusée : formats acceptés JPG, PNG, WEBP ou GIF.');
  if (file.size > 5 * 1024 * 1024) throw new Error('Image trop lourde (5 Mo maximum).');
  const path = `${dir || 'content'}/${ym()}/${uid8()}-${file.name.replace(/[^\w.\-]+/g, '_')}`;
  await q(sb.storage.from('images').upload(path, file, { contentType: file.type, cacheControl: '31536000' }));
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
}

  const cnt = (t, f) => { const x = sb.from(t).select('*', { count: 'exact', head: true }); return q(f ? f(x) : x).then(r => r.count || 0).catch(() => 0); };

    q(sb.from('payments').select('amount,currency,created_at').eq('status', 'validated')),
    q(sb.from('profiles').select('church').limit(2000)),
    cnt('reports'), cnt('conversation_invites', x => x.eq('status', 'pending'))
  ]);
  const rev = {}; pay.data.forEach(r => { const c = r.currency || 'FCFA'; rev[c] = (rev[c] || 0) + Number(r.amount || 0); });
  const revTxt = Object.keys(rev).length ? Object.entries(rev).map(([c, v]) => money(v, c)).join(' + ') : money(0);
  const k = (l, v) => `<div class="card"><span class="m">${l}</span><b>${v}</b></div>`;

  // Revenus sur 30 jours
  const cnts = {}; pay.data.forEach(r => { const c = r.currency || 'FCFA'; cnts[c] = (cnts[c] || 0) + 1; });
  const mainCur = Object.keys(cnts).sort((a, b) => cnts[b] - cnts[a])[0] || 'FCFA', multi = Object.keys(cnts).length > 1;
  const days = [...Array(30)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 29 + i); return d.toISOString().slice(0, 10); });
  const by = Object.fromEntries(days.map(d => [d, 0]));
  pay.data.filter(r => (r.currency || 'FCFA') === mainCur).forEach(r => { const d = (r.created_at || '').slice(0, 10); if (d in by) by[d] += Number(r.amount || 0); });
  const vals = days.map(d => by[d]), mx = Math.max(...vals, 1);
  const pts = vals.map((v, i) => [10 + i * (580 / 29), 160 - (v / mx) * 140]);
  const line = pts.map(p => p.join(',')).join(' ');
  const chart = `<svg viewBox="0 0 600 190" style="width:100%;height:auto" role="img" aria-label="Revenus des 30 derniers jours">
    <polygon points="10,160 ${line} 590,160" fill="#1e3a8a" opacity=".08"/><polyline points="${line}" fill="none" stroke="#1e3a8a" stroke-width="2"/>

  const col = ['#1e3a8a', '#3b82f6', '#93c5fd', '#f59e0b', '#10b981', '#d0d5dd'], tot = prof.data.length || 1;
  let acc = 0; const stops = main5.map(([, n], i) => { const a = acc / tot * 100; acc += n; return `${col[i]} ${a}% ${acc / tot * 100}%`; }).join(',');
  const donut = `<div class="donut" style="background:conic-gradient(${stops || '#e4e7ec 0 100%'})"><span>${top.length}<br>églises</span></div>

  $('#main').innerHTML = head('Tableau de bord', 'Vue d\'ensemble de l\'activité et des revenus de la communauté.',
    `<div class="acts"><button class="p" data-t="songs">${ico('music')}Ajouter une musique</button><button data-t="verses">${ico('book')}Ajouter un verset</button><button data-t="games">${ico('game')}Ajouter un jeu</button></div>`)
    + `<div class="cards">${k('Membres', m)}${k('Paiements à traiter', pend)}${k('Revenus validés', esc(revTxt))}${k('Prières', pr)}${k('Musiques', so)}${k('Versets', ve)}${k('Jeux', je)}${k('Signalements', rep)}${k('Invitations en attente', inv)}</div>`

};

function vidStatus(r) {
  const now = Date.now(), pa = r.publish_at && new Date(r.publish_at), ex = r.expires_at && new Date(r.expires_at);
  if (pa && pa > now) return `<span class="tag pending">Programmée</span><span class="vd">le ${esc(fmtDT(pa))}</span>`;
  if (ex && ex < now) return `<span class="tag rejected">Expirée</span><span class="vd">depuis le ${esc(day(ex))}</span>`;
  return '<span class="tag approved">En ligne</span>' + (ex ? `<span class="vd">jusqu’au ${esc(fmtDT(ex))}</span>` : '<span class="vd">sans limite</span>');
}

async function squeeze(file, kbps) {
  if (!window.lamejs) throw new Error('Outil de compression indisponible : vérifiez votre connexion ou choisissez « Original ».');
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let buf; try { buf = await ctx.decodeAudioData(await file.arrayBuffer()); } finally { ctx.close(); }
  const ch = Math.min(buf.numberOfChannels, 2), enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, kbps);
  const to16 = f => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); o[i] = v < 0 ? v * 32768 : v * 32767; } return o; };
  const L = to16(buf.getChannelData(0)), R = ch > 1 ? to16(buf.getChannelData(1)) : null, step = 1152 * 10, parts = [];
  for (let i = 0, n = 0; i < L.length; i += step, n++) {
    const o = ch > 1 ? enc.encodeBuffer(L.subarray(i, i + step), R.subarray(i, i + step)) : enc.encodeBuffer(L.subarray(i, i + step));
    if (o.length) parts.push(o);
    if (n % 30 === 0) await new Promise(r => setTimeout(r));
  }
  const end = enc.flush(); if (end.length) parts.push(end);
  return new File(parts, file.name.replace(/\.[^.]+$/, '') + '.mp3', { type: 'audio/mpeg' });
}

const FORMS = {
  async song(f) {
    let file = f.file.files[0]; if (!file) throw new Error('Choisissez un fichier audio.');
    if (!/^audio\//.test(file.type) && file.type !== 'video/mp4' && !/\.(mp3|m4a|wav|ogg|aac|flac|mp4)$/i.test(file.name)) throw new Error('Format refusé : choisissez un fichier audio (mp3, m4a, wav) ou une vidéo MP4.');
    const title = f.title.value.trim() || cleanTitle(file.name);
    const kb = Number(f.quality.value), btn = f.querySelector('button.p'), txt = btn.innerHTML;
    if (kb) {
      btn.textContent = 'Compression en cours…';
      try { const small = await squeeze(file, kb); if (small.size < file.size) { toast(`Fichier allégé : ${(file.size / 1e6).toFixed(1)} Mo → ${(small.size / 1e6).toFixed(1)} Mo`); file = small; } }
      finally { btn.innerHTML = txt; }
    }
    if (file.size > 50 * 1024 * 1024) throw new Error('Fichier trop lourd (50 Mo maximum) : choisissez une compression plus forte.');
    const duration = await audioDuration(file);
    const path = audioPath(title, extOf(file.name), new Date());
    btn.textContent = 'Envoi en cours…';
    try { await q(sb.storage.from('musiques').upload(path, file, { contentType: file.type || 'audio/mpeg', cacheControl: '31536000', upsert: false })); }
    catch (e) { throw new Error('Envoi du fichier refusé : ' + (e.message || e)); }
    const row = { title, artist: f.artist.value.trim() || null, url: path, storage_path: path, size_bytes: file.size, mime_type: file.type || 'audio/mpeg' };
    if (duration) row.duration = duration;
    if (cache.pk && !(cache.pk in row)) row[cache.pk] = path;
    let cover = null;
    try { cover = await upImg(f.photo.files[0], 'covers'); } catch (e) { sb.storage.from('musiques').remove([path]); throw e; }
    if (cover) row.image_url = cover;
    const OPTIONAL = ['size_bytes', 'mime_type', 'duration'], skipped = [];
    for (;;) {
      try { await q(sb.from('musiques').insert(row)); break; }
      catch (e) {
        const m = /Could not find the '([^']+)' column/.exec(e.message || '');
        const others = ['url', 'storage_path'].filter(k => k !== m?.[1] && k in row);
        if (m && m[1] in row && (!['url', 'storage_path'].includes(m[1]) || others.length)) { delete row[m[1]]; if (!OPTIONAL.includes(m[1])) skipped.push(m[1]); continue; }
        sb.storage.from('musiques').remove([path]);   // pas de fichier orphelin si la ligne n'a pas pu être créée
        throw new Error('Enregistrement refusé : ' + (e.message || e));
      }
    }
    if (skipped.length) toast('Colonne(s) absente(s) de votre table, ignorée(s) : ' + skipped.join(', '));
  }
};
// ---- Traduction automatique des paroles (même service que le site) ----
const AUTO_LANGS = ['fr', 'en', 'es', 'pt', 'it', 'de', 'ar', 'zh-CN', 'nl', 'ru'];
const TS_RE = /^(\[\d+:\d+(?:\.\d+)?\]\s*)?(.*)$/;
async function gtxLines(lines, tl) {
  const SEP = '\n§§§\n';
  const r = await fetch('https://translate.googleapis.com/translate_a/single', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'client=gtx&sl=auto&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(lines.join(SEP))
  });
  if (!r.ok) throw new Error('Service de traduction indisponible');
  const j = await r.json(), full = (j[0] || []).map(x => x[0] || '').join('');
  const parts = full.split(/\s*§\s*§\s*§\s*/);
  if (parts.length !== lines.length) throw new Error('Découpage incohérent');
  return parts.map(x => x.trim());
}
async function autoTranslate(mid, langue, texte) {
  const lines = texte.split(/\r?\n/), idx = lines.map((l, i) => l.trim() ? i : -1).filter(i => i >= 0);
  const parsed = idx.map(i => TS_RE.exec(lines[i].trim()));
  const have = new Set(Object.values(cache.lyr || {}).filter(x => String(x.musique_id) === String(mid)).map(x => x.langue));
  const ok = [], ko = [];
  for (const tl of AUTO_LANGS) {
    const code = tl.slice(0, 2);
    if (code === langue || have.has(code)) continue;
    try {
      const out = [];
      for (let k = 0; k < parsed.length; k += 30) out.push(...await gtxLines(parsed.slice(k, k + 30).map(m => m[2]), tl));
      const res = lines.slice(); idx.forEach((i, k) => { res[i] = (parsed[k][1] || '') + out[k]; });
      await q(sb.from('paroles').upsert({ musique_id: mid, langue: code, texte: res.join('\n') }, { onConflict: 'musique_id,langue' }));
      ok.push(code);
    } catch (e) { ko.push(code); }
  }
  if (ok.length) toast('Traductions ajoutées : ' + ok.join(', ').toUpperCase());
  if (ko.length) toast('Traduction impossible pour : ' + ko.join(', ').toUpperCase() + ' (réessayez plus tard)', true);
}

// ---- Envoi d'une vidéo : lecture des infos, miniature automatique, envoi avec progression ----
function videoInfo(file) {
  return new Promise(res => {
    const v = document.createElement('video'), u = URL.createObjectURL(file); let done = false, dur = null;
    const end = r => { if (done) return; done = true; URL.revokeObjectURL(u); res(r); };
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    v.onloadedmetadata = () => { dur = isFinite(v.duration) ? Math.round(v.duration) : null; v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = () => {
      try {
        const w = v.videoWidth, h = v.videoHeight, k = Math.min(1, 640 / (w || 640)), c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(b => end({ duration: dur, poster: b }), 'image/jpeg', .8);
      } catch (e) { end({ duration: dur, poster: null }); }
    };
    v.onerror = () => end({ duration: null, poster: null });
    setTimeout(() => end({ duration: dur, poster: null }), 8000);
    v.src = u;
  });
}
async function upVideo(file, path, onPct) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Session expirée : reconnectez-vous.');
  await new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${SB_URL}/storage/v1/object/videos/${path.split('/').map(encodeURIComponent).join('/')}`);
    x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('Content-Type', 'video/mp4');
    x.setRequestHeader('Cache-Control', 'max-age=31536000');
    x.upload.onprogress = e => { if (e.lengthComputable) onPct(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status < 300) return ok();
      let m = ''; try { m = JSON.parse(x.responseText).message; } catch (e) {}
      ko(new Error(m || 'erreur ' + x.status));
    };
    x.onerror = () => ko(new Error('connexion perdue pendant l’envoi.'));
    x.send(file);
  });
}

};
function paintMe() {
  const u = me && me.user_metadata && me.user_metadata.avatar_url, el = $('#mepic');
  el.style.backgroundImage = u ? `url("${String(u).replace(/"/g, '%22')}")` : '';
  el.textContent = u ? '' : ((me && me.email) || '?')[0].toUpperCase();
}
$('#mefile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const u = await upImg(f, 'admins');
    const { data, error } = await sb.auth.updateUser({ data: { avatar_url: u } });
    if (error) throw error;
    me = data.user; paintMe(); toast('Photo de profil mise à jour');
  } catch (err) { toast('Photo refusée : ' + (err.message || err), true); }
  e.target.value = '';
};
$('#eye').onclick = () => {
  const i = $('#lf').pw, show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  $('#eye').textContent = show ? 'Masquer' : 'Afficher';
  $('#eye').setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
};
$('#out').onclick = async () => { await sb.auth.signOut(); me = null; boot(); };
boot().catch(e => { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lerr').textContent = 'Connexion au serveur impossible : ' + (e.message || e); });
</script>
</body>
</html>
