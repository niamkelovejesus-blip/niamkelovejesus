<!DOCTYPE html>
<html data-nlj-page="bible" lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../assets/js/shared/frame-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Bible — Niamké Love Jésus</title>
<style>
:root{--nuit:#0f2a4a;--ciel:#1d4a7a;--or:#c9a227;--aube:#fbf7ec;--texte:#1b2430;--gris:#5b6675;--fs:19px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--nuit);color:var(--texte);display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;background:var(--aube)}
header{background:var(--nuit);color:#fff;padding:12px 14px;border-bottom:3px solid var(--or);display:flex;align-items:center;gap:10px}
header h1{margin:0;font:600 1.25rem/1.2 Georgia,serif;flex:1;min-width:0}
.hb{flex:none;font:inherit;font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.hb:hover{background:rgba(255,255,255,.14)}
.bar{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e6dfc9}
.bar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 14px;border:1.5px solid #c9c2ab;border-radius:999px}
.bar button,.bar select{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:999px;border:1.5px solid var(--nuit);background:#fff;color:var(--nuit);cursor:pointer}
.tabs{display:flex;gap:6px;padding:8px 14px 0;background:#fff}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:.9rem;padding:8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--gris);cursor:pointer}
.tabs button.on{color:var(--nuit);border-color:var(--or)}
main{flex:1;overflow-y:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
h2{font:600 1.15rem Georgia,serif;color:var(--nuit);margin:18px 0 10px}
.vdj{background:var(--nuit);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:8px;border-left:5px solid var(--or)}
.vdj small{display:block;color:#e7d9a6;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;margin-bottom:6px}
.vdj p{margin:0 0 8px;font:italic 1.1rem/1.55 Georgia,serif}
.vdj b{font:600 .85rem system-ui;color:#cfd8e6}
.vdj button{margin-left:10px;font:inherit;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.books button,.chaps button{font:inherit;font-size:.92rem;padding:10px 8px;border-radius:10px;border:1.5px solid #d9d1b6;background:#fff;color:var(--nuit);cursor:pointer;text-align:center}
.books button:hover,.chaps button:hover{background:var(--nuit);color:#fff}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.crumb button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1.5px solid var(--nuit);background:#fff;color:var(--nuit);cursor:pointer}
.ch h2{margin:6px 0 12px}
.vs{font:var(--fs)/1.65 Georgia,"Times New Roman",serif;margin:0 0 4px;padding:3px 6px;border-radius:6px;cursor:pointer}
.vs sup{font:700 .6em system-ui;color:var(--or);margin-right:5px}
.wj{color:#b3261e}
.vs.sel{background:#f3e9c4}
.vs.fav{border-left:3px solid var(--or)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;border:0;background:var(--nuit);color:#fff;cursor:pointer}
.nav button[disabled]{opacity:.35}
.act{position:sticky;bottom:0;display:none;gap:8px;justify-content:center;padding:10px;background:#fff;border-top:2px solid var(--or);margin:12px -16px -40px}
.act.on{display:flex}
.act button{font:inherit;font-size:.9rem;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--nuit);background:#fff;color:var(--nuit);cursor:pointer}
.res{padding:10px 12px;border:1px solid #e6dfc9;border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;font:1rem/1.5 Georgia,serif}
.res b{display:block;font:700 .8rem system-ui;color:var(--ciel);margin-bottom:2px}
.res mark{background:#f3e9c4}
.msg{color:var(--gris);text-align:center;padding:24px 8px}
.warn{background:#fff7e0;border:1px solid #e8d18a;border-radius:10px;padding:12px 14px;font-size:.9rem;margin:12px 0}
.hint{font-size:.78rem;color:var(--gris);margin-top:10px}
.pbar{height:10px;border-radius:99px;background:#e6dfc9;overflow:hidden}.pbar i{display:block;height:100%;background:var(--or)}
.pnext{width:100%;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:var(--nuit);color:#fff;cursor:pointer;margin-bottom:12px}
.prow.ok{opacity:.65}
.plan-ok{text-align:center;margin-top:16px}.plan-ok button{font:inherit;font-weight:700;padding:11px 18px;border-radius:999px;border:2px solid var(--or);background:#fff;color:var(--nuit);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header><button class="hb" id="back" type="button" aria-label="Retour">← Retour</button><h1>📖 La Bible</h1><button class="hb" id="fsm" type="button" aria-label="Réduire le texte">A−</button><button class="hb" id="fsp" type="button" aria-label="Agrandir le texte">A+</button></header>
<div class="bar"><input id="q" type="search" placeholder="Chercher un mot ou « Jean 3:16 »…" aria-label="Rechercher" autocomplete="off"><select id="tr" aria-label="Traduction" hidden></select><button id="go" type="button">OK</button></div>
<div class="tabs" role="tablist"><button class="on" data-t="lire" type="button">Lire</button><button data-t="plan" type="button">📅 Plan</button><button data-t="fav" type="button">⭐ Favoris</button></div>
<main id="main"></main>
</div>
<script src="../assets/js/bible/01-bible.js?v=54"></script>
</body>
</html>
