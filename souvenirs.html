<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1530">
<title>Souvenirs · Niamké Love Jésus</title>
<meta name="description" content="Les vidéos souvenirs de la communauté Niamké Love Jésus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0e1530;--surface:#16204a;--line:#2a3768;--text:#f2efe6;--mut:#aab3d1;--gold:#d4a85a;--blue:#3b82f6;
  --serif:Newsreader,Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:16px/1.6 var(--sans);color:var(--text);background:var(--bg);min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header.top{padding:22px 0 0}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;font-weight:500;padding:6px 0}
.back:hover{color:var(--text)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.intro{padding:44px 0 36px;max-width:640px}
.intro h1{margin:0 0 12px;font:600 clamp(40px,7vw,68px)/1.02 var(--serif);letter-spacing:-.02em}
.intro p{margin:0;color:var(--mut);font-size:18px;max-width:46ch}

.state{padding:48px 0 80px;color:var(--mut)}
.state b{display:block;color:var(--text);font:600 22px/1.3 var(--serif);margin-bottom:6px}
.state button{margin-top:14px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 16px}
.state button:hover{border-color:var(--gold)}

.shot{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.empty{display:grid;place-items:center;background:linear-gradient(135deg,#1b2860,#101a40)}
.play{position:absolute;left:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:rgba(14,21,48,.78);border:1.5px solid var(--text);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.play svg{width:18px;height:18px;fill:var(--text);margin-left:2px}
.shot.empty .play{position:static}
.big .play{width:68px;height:68px;left:20px;bottom:20px}
.big .play svg{width:24px;height:24px}
.tile:hover .play,.tile:focus-visible .play{background:var(--gold);border-color:var(--gold);transform:scale(1.06)}
.tile:hover .play svg,.tile:focus-visible .play svg{fill:#1a1405}
.dur{position:absolute;right:12px;bottom:14px;background:rgba(14,21,48,.82);padding:2px 9px;border-radius:99px;font-size:13px;font-weight:500}
.tile{display:block;width:100%;padding:0;border:0;background:none;text-align:left}

.feature{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:36px;align-items:center;padding-bottom:56px;border-bottom:1px solid var(--line)}
.feature h2{margin:0 0 8px;font:600 clamp(26px,3.6vw,38px)/1.12 var(--serif);letter-spacing:-.01em}
.feature .date{color:var(--mut);margin:0 0 14px}
.feature .when{color:var(--gold);font-weight:500;margin:-8px 0 14px}
h3.more.first{margin-top:8px}
.state.ended{padding:4px 0 36px}
.feature .desc{margin:0;color:var(--mut);max-width:44ch;white-space:pre-line}

h3.more{margin:48px 0 22px;font:600 26px/1.2 var(--serif)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 22px}
.card h4{margin:12px 0 2px;font:600 19px/1.25 var(--serif)}
.card .date{margin:0;color:var(--mut);font-size:14px}
.card .desc{margin:6px 0 0;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morebtn{display:block;margin:44px auto 0;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 22px;font-weight:500}
.morebtn:hover{border-color:var(--gold)}
footer{padding:64px 0 40px;color:var(--mut);font-size:14px}

dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(960px,calc(100vw - 24px));max-width:none;max-height:calc(100vh - 24px);overflow:visible}
dialog::backdrop{background:rgba(5,8,20,.88)}
.box{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.box video{display:block;width:100%;max-height:72vh;background:#000}
.cap{padding:16px 20px 20px}
.cap h2{margin:0 0 2px;font:600 24px/1.2 var(--serif)}
.cap .date{margin:0;color:var(--gold);font-size:14px;font-weight:500}
.cap .desc{margin:10px 0 0;color:var(--mut);white-space:pre-line}
.x{position:absolute;right:8px;top:-46px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:500;color:var(--text)}
.x:hover{border-color:var(--gold)}

@media(max-width:820px){
  .feature{grid-template-columns:1fr;gap:20px}
  .intro{padding:30px 0 26px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <!-- Si la page d'accueil de votre site porte un autre nom que index.html, changez-le ici -->
  <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Retour au site</a>
</div></header>

<main class="wrap">
  <section class="intro">
    <h1>Souvenirs</h1>
    <p>La prière de la semaine et les moments que nous avons vécus ensemble, en vidéo.</p>
  </section>
  <div id="out"><p class="state" style="padding:20px 0">Chargement des vidéos…</p></div>
</main>

<footer><div class="wrap">Niamké Love Jésus</div></footer>

<dialog id="dlg" aria-label="Lecteur vidéo">
  <button class="x" id="close" type="button">Fermer</button>
  <div class="box">
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="cap"><h2 id="ct"></h2><p class="date" id="cd"></p><p class="desc" id="cx"></p></div>
  </div>
</dialog>

<script>
const SB_URL = 'https://qxxhbfoqlreiqyshbpqp.supabase.co';
const SB_KEY = 'sb_publishable_OK9ncVWB2Ih8xZ5fzqEQWg_mSV6vCoe'; // clé publique : la sécurité est assurée par les règles RLS
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const fmtDur = s => s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
const urlOf = v => v.url || (v.storage_path ? sb.storage.from('videos').getPublicUrl(v.storage_path).data.publicUrl : '');
const PLAY = '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>';
const PER = 12;
let vids = [], shown = PER, lastBtn = null, tick = null, curPrayer = null, souv = [], hasPrayerSection = false, prayerEnded = false;
const when = v => fmtDate(v.publish_at || v.created_at);

const shot = (v, big) => `<span class="shot${v.image_url ? '' : ' empty'}${big ? ' big' : ''}">${v.image_url ? `<img src="${esc(v.image_url)}" alt="" loading="lazy">` : ''}${PLAY}${v.duration ? `<span class="dur">${esc(fmtDur(v.duration))}</span>` : ''}</span>`;
const card = (v, i) => `<article class="card"><button class="tile" data-i="${i}" aria-label="Regarder : ${esc(v.title)}">${shot(v)}</button><h4>${esc(v.title)}</h4><p class="date">${esc(when(v))}</p>${v.description ? `<p class="desc">${esc(v.description)}</p>` : ''}</article>`;
const feat = (v, i, extra = '') => `<section class="feature"><button class="tile big" data-i="${i}" aria-label="Regarder : ${esc(v.title)}">${shot(v, true)}</button><div><h2>${esc(v.title)}</h2><p class="date">${esc(when(v))}</p>${extra}${v.description ? `<p class="desc">${esc(v.description)}</p>` : ''}</div></section>`;

// Temps restant avant la disparition de la prière
function left(v) {
  const ms = new Date(v.expires_at) - Date.now();
  if (ms <= 0) return 'Cette prière vient de se terminer';
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  if (h >= 48) return `Disparaît dans ${Math.floor(h / 24)} jours`;
  if (h >= 1) return `Disparaît dans ${h} h ${String(m).padStart(2, '0')} min`;
  return `Disparaît dans ${Math.max(1, m)} min`;
}

function draw() {
  const off = curPrayer ? 1 : 0, lead = (!hasPrayerSection && souv.length) ? 1 : 0;
  let h = '';
  if (curPrayer) h += '<h3 class="more first">Prière de la semaine</h3>' + feat(curPrayer, 0, curPrayer.expires_at ? `<p class="when" id="left">${esc(left(curPrayer))}</p>` : '');
  else if (prayerEnded) h += '<h3 class="more first">Prière de la semaine</h3><div class="state ended"><b>La prière de cette semaine est terminée</b>La prochaine sera publiée bientôt.</div>';
  if (lead) h += feat(souv[0], off);
  const rest = souv.slice(lead, lead + shown);
  if (rest.length) h += `<h3 class="more">${hasPrayerSection ? 'Souvenirs' : 'Plus de souvenirs'}</h3><div class="grid">${rest.map((v, k) => card(v, off + lead + k)).join('')}</div>`;
  if (souv.length > lead + shown) h += '<button class="morebtn" id="more">Afficher plus de vidéos</button>';
  $('#out').innerHTML = h;
  clearInterval(tick);
  if (curPrayer && curPrayer.expires_at) tick = setInterval(() => {
    if (new Date(curPrayer.expires_at) - Date.now() <= 0) return load();
    const el = $('#left'); if (el) el.textContent = left(curPrayer);
  }, 30000);
}
function fail(msg) {
  $('#out').innerHTML = `<div class="state"><b>Les vidéos ne se chargent pas</b>${esc(msg)}<br><button id="retry">Réessayer</button></div>`;
  $('#retry').onclick = load;
}
async function load() {
  $('#out').innerHTML = '<p class="state" style="padding:20px 0">Chargement des vidéos…</p>';
  try {
    const { data, error } = await sb.from('videos_souvenirs').select('*').order('created_at', { ascending: false }).limit(200);
    if (error) throw error;
    const all = (data || []).filter(urlOf), now = Date.now();
    const t = v => new Date(v.publish_at || v.created_at).getTime();
    const live = all.filter(v => t(v) <= now && (!v.expires_at || new Date(v.expires_at) > now)).sort((a, b) => t(b) - t(a));
    curPrayer = live.find(v => v.kind === 'priere') || null;
    prayerEnded = !curPrayer && all.some(v => v.kind === 'priere' && t(v) <= now);
    hasPrayerSection = !!(curPrayer || prayerEnded);
    souv = live.filter(v => v.kind !== 'priere');
    vids = curPrayer ? [curPrayer, ...souv] : souv;
    if (!hasPrayerSection && !souv.length) return $('#out').innerHTML = '<div class="state"><b>Aucune vidéo pour le moment</b>Les souvenirs et la prière de la semaine apparaîtront ici dès qu’ils seront publiés. Revenez bientôt.</div>';
    shown = PER; draw();
  } catch (e) { fail('Vérifiez votre connexion internet, puis réessayez.'); }
}

const dlg = $('#dlg'), vid = $('#vid');
function open(i, btn) {
  const v = vids[i]; if (!v) return;
  lastBtn = btn;
  $('#ct').textContent = v.title || '';
  $('#cd').textContent = when(v);
  $('#cx').textContent = v.description || ''; $('#cx').hidden = !v.description;
  vid.poster = v.image_url || ''; vid.src = urlOf(v);
  dlg.showModal(); vid.play().catch(() => {});
}
function shut() { vid.pause(); vid.removeAttribute('src'); vid.load(); if (lastBtn) lastBtn.focus(); }
dlg.addEventListener('close', shut);
$('#close').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (t) return open(+t.dataset.i, t);
  if (e.target.id === 'more') { shown += PER; draw(); }
});
load();
</script>
</body>
</html>
